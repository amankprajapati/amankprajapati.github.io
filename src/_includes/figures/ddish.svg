<svg viewBox="0 0 680 476" role="img" aria-label="Training: whole slide images are tiled into unlabeled crops, two augmented views of each crop train a YOLO backbone with SimCLR, and the detector is fine tuned on annotated nuclei. Inference: a patch is cropped, nuclei are segmented, HER2 and CEP17 signals are detected, counts are reviewed per nucleus in a web viewer, and the HER2 to CEP17 ratio gives the therapy call.">
