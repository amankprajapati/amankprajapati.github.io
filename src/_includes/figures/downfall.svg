<svg viewBox="0 0 680 364" role="img" id="df-fig" aria-label="Side view of the four stage course with the camera following the PPO agent. Its five raycasts are coloured by what they hit, the panel below shows the observation vector the policy receives, and the episode return grows with a jump at each stage gate.">
  <defs>
    <clipPath id="df-view-clip"><rect x="20" y="10" width="640" height="170" rx="6"/></clipPath>
  </defs>
  <rect x="20" y="10" width="640" height="170" rx="6" fill="#EEF1F5"/>
  <g clip-path="url(#df-view-clip)"><g id="df-world"></g></g>
  <text class="svg-label" x="20" y="204">observation vector</text>
  <g id="df-obs"></g>
  <text class="svg-label" x="400" y="204">episode return</text>
  <line x1="400" y1="326" x2="660" y2="326" stroke="#98A1AD" stroke-width=".6"/>
  <line x1="400" y1="214" x2="400" y2="326" stroke="#98A1AD" stroke-width=".6"/>
  <polyline id="df-return" fill="none" stroke="#2C7A52" stroke-width="2"/>
  <text class="svg-label" x="400" y="352" style="font-size:11px">rays:</text>
  <rect x="432" y="343" width="10" height="10" rx="2" fill="#2C7A52"/>
  <text class="svg-label" x="446" y="352" style="font-size:11px">ground</text>
  <rect x="494" y="343" width="10" height="10" rx="2" fill="#5F6773"/>
  <text class="svg-label" x="508" y="352" style="font-size:11px">wall</text>
  <rect x="544" y="343" width="10" height="10" rx="2" fill="#B4342C"/>
  <text class="svg-label" x="558" y="352" style="font-size:11px">hazard</text>
</svg>
