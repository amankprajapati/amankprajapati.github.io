<svg viewBox="0 0 680 340" role="img" id="isro-fig" aria-label="Telemetry is encoded and decoded by an autoencoder whose loss adds a rigid body physics term. A playhead sweeps through the gyroscope signal, the residual rises at an anomaly, and the physics informed alert fires three to four minutes before the rule based check.">
  <defs>
    <clipPath id="isro-reveal-clip"><rect id="isro-reveal" x="20" y="160" width="0" height="150"/></clipPath>
  </defs>
  <rect x="20" y="20" width="112" height="48" rx="4" fill="#EEF1F5" stroke="#C9D0DA"/>
  <text class="svg-title" x="76" y="40" text-anchor="middle">Telemetry</text>
  <text class="svg-label" x="76" y="57" text-anchor="middle" style="font-size:11px">60 s window</text>
  <path class="arrow" d="M134,44 L156,44"/>
  <path d="M160,24 L250,34 L250,54 L160,64 Z" fill="#EDE9F8" stroke="#8B7FC7"/>
  <text class="svg-title" x="202" y="48" text-anchor="middle" style="fill:#3E3585">Encoder</text>
  <rect x="262" y="31" width="30" height="26" rx="4" fill="#EDE9F8" stroke="#8B7FC7"/>
  <text class="svg-title" x="277" y="48" text-anchor="middle" style="fill:#3E3585">z</text>
  <path d="M304,34 L394,24 L394,64 L304,54 Z" fill="#EDE9F8" stroke="#8B7FC7"/>
  <text class="svg-title" x="352" y="48" text-anchor="middle" style="fill:#3E3585">Decoder</text>
  <path class="arrow" d="M396,44 L418,44"/>
  <rect x="422" y="20" width="238" height="48" rx="4" fill="#E9F0FA" stroke="#1F4E9C"/>
  <text class="svg-title" x="541" y="40" text-anchor="middle" style="fill:#1F4E9C">Reconstruction</text>
  <text class="svg-label" x="541" y="57" text-anchor="middle" style="font-size:11px">only physically possible motion</text>
  <rect x="160" y="82" width="500" height="48" rx="4" fill="#E8F3EC" stroke="#2C7A52"/>
  <text class="svg-title" x="410" y="102" text-anchor="middle" style="fill:#1F5A3C">loss = data fit + λ · rigid body physics residual</text>
  <text class="svg-label" x="410" y="119" text-anchor="middle" style="font-size:11px">reconstructions that break the dynamics are penalised</text>
  <text class="svg-label" x="20" y="164">gyroscope rate</text>
  <polyline id="isro-raw" fill="none" stroke="#98A1AD" stroke-width="1.2"/>
  <polyline id="isro-rec" fill="none" stroke="#1F4E9C" stroke-width="2"/>
  <text class="svg-label" x="20" y="252">residual</text>
  <line x1="20" y1="268" x2="660" y2="268" stroke="#B4342C" stroke-dasharray="4 3"/>
  <text class="svg-label" x="660" y="262" text-anchor="end" style="font-size:11px;fill:#B4342C">threshold</text>
  <g id="isro-bars" clip-path="url(#isro-reveal-clip)"></g>
  <line id="isro-play" x1="20" y1="158" x2="20" y2="308" stroke="#1F4E9C" stroke-width="1.2"/>
  <g id="isro-alert" opacity="0">
    <line x1="452" y1="158" x2="452" y2="308" stroke="#2C7A52" stroke-width="1.6"/>
    <text class="svg-label" x="446" y="328" text-anchor="end" style="fill:#2C7A52">physics informed alert</text>
  </g>
  <g id="isro-rule" opacity="0">
    <line x1="520" y1="158" x2="520" y2="308" stroke="#98A1AD" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text class="svg-label" x="526" y="328">rule based check</text>
  </g>
  <g id="isro-gap" opacity="0">
    <path d="M452,312 L452,317 L520,317 L520,312" fill="none" stroke="#59616E"/>
    <text class="svg-label" x="486" y="334" text-anchor="middle" style="font-size:11px">3 to 4 min</text>
  </g>
</svg>
