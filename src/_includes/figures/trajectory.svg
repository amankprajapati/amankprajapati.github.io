<svg viewBox="0 0 680 480" role="img" id="traj-fig" aria-label="Camera, IMU and GPS inputs are encoded by a 3D CNN and sensor tokens, fused by a transformer into a five second forecast of path, speed and turn angle. Below, the forecast drives the vehicle through traffic without lane markings, with a speedometer and steering wheel showing the control output.">
  <defs>
    <clipPath id="traj-road-clip"><rect x="170" y="150" width="260" height="320" rx="6"/></clipPath>
  </defs>
  <rect x="20" y="20" width="182" height="104" rx="4" fill="#EEF1F5" stroke="#C9D0DA"/>
  <text class="svg-label" x="30" y="38" style="font-size:11px">camera</text>
  <rect x="30" y="44" width="72" height="54" rx="3" fill="#E2E6EB"/>
  <path d="M44 98 L62 52 L70 52 L88 98 Z" fill="#CDD3DC"/>
  <g id="traj-cam"></g>
  <text class="svg-label" x="112" y="38" style="font-size:11px">IMU</text>
  <polyline id="traj-imu" fill="none" stroke="#574CA6" stroke-width="1.3"/>
  <text class="svg-label" x="112" y="84" style="font-size:11px">GPS</text>
  <g id="traj-gps"></g>
  <path class="arrow" d="M204,72 L222,72"/>
  <rect x="226" y="20" width="116" height="44" rx="4" fill="#EDE9F8" stroke="#8B7FC7"/>
  <text class="svg-title" x="284" y="46" text-anchor="middle" style="fill:#3E3585">3D CNN</text>
  <rect x="226" y="80" width="116" height="44" rx="4" fill="#EDE9F8" stroke="#8B7FC7"/>
  <text class="svg-title" x="284" y="106" text-anchor="middle" style="fill:#3E3585">sensor tokens</text>
  <path class="arrow" d="M344,42 C356,42 354,66 364,68"/>
  <path class="arrow" d="M344,102 C356,102 354,78 364,76"/>
  <rect x="368" y="46" width="112" height="52" rx="4" fill="#EDE9F8" stroke="#8B7FC7"/>
  <text class="svg-title" x="424" y="68" text-anchor="middle" style="fill:#3E3585">Transformer</text>
  <text class="svg-label" x="424" y="85" text-anchor="middle" style="font-size:11px">temporal fusion</text>
  <path class="arrow" d="M482,72 L500,72"/>
  <rect x="504" y="20" width="156" height="104" rx="4" fill="#E8F3EC" stroke="#2C7A52"/>
  <text class="svg-title" x="516" y="40" style="fill:#1F5A3C">Forecast, 5 s</text>
  <text class="svg-label" x="516" y="62" style="font-size:11px">path</text>
  <text class="svg-label" x="516" y="84" style="font-size:11px">speed</text>
  <text class="svg-label" x="516" y="106" style="font-size:11px">turn angle</text>
  <text class="svg-label" id="traj-o-path" x="580" y="62" style="font-size:11px;fill:#15181D">keep course</text>
  <text class="svg-num" id="traj-o-speed" x="580" y="84">38 km/h</text>
  <text class="svg-num" id="traj-o-angle" x="580" y="106">0°</text>
  <g id="traj-pulses"></g>
  <path d="M582,126 L582,140 L545,140 L545,156" fill="none" stroke="#1F4E9C" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arA)"/>
  <rect x="170" y="150" width="260" height="320" rx="6" fill="#E4E8EE"/>
  <line x1="170" y1="150" x2="170" y2="470" stroke="#98A1AD" stroke-width="1.5"/>
  <line x1="430" y1="150" x2="430" y2="470" stroke="#98A1AD" stroke-width="1.5"/>
  <g clip-path="url(#traj-road-clip)">
    <path id="traj-band" fill="#1F4E9C" fill-opacity=".13"/>
    <path id="traj-path" fill="none" stroke="#1F4E9C" stroke-width="2.5" stroke-linecap="round"/>
    <g id="traj-dots"></g>
    <g id="traj-traffic"></g>
    <g id="traj-ego">
      <rect x="-12" y="-21" width="24" height="42" rx="5" fill="#1F4E9C"/>
      <rect x="-8" y="-15" width="16" height="10" rx="2" fill="#E9F0FA"/>
    </g>
  </g>
  <text class="svg-label" x="20" y="172" style="font-size:11px">forecast dots mark</text>
  <text class="svg-label" x="20" y="188" style="font-size:11px">t + 1 … 5 s</text>
  <text class="svg-label" x="20" y="216" style="font-size:11px">shaded band grows</text>
  <text class="svg-label" x="20" y="232" style="font-size:11px">with the horizon</text>
  <text class="svg-label" x="20" y="460" style="font-size:11px">values illustrative</text>
  <text class="svg-title" x="450" y="172">Vehicle control</text>
  <path d="M478.3,279.7 A42,42 0 1 1 537.7,279.7" fill="none" stroke="#E2E6EB" stroke-width="6" stroke-linecap="round"/>
  <path id="traj-speed-arc" fill="none" stroke="#2C7A52" stroke-width="6" stroke-linecap="round"/>
  <line id="traj-needle" x1="508" y1="250" x2="508" y2="216" stroke="#5F6773" stroke-width="2" stroke-linecap="round"/>
  <circle cx="508" cy="250" r="4" fill="#5F6773"/>
  <text class="svg-num" id="traj-speed" x="508" y="304" text-anchor="middle">38 km/h</text>
  <text class="svg-label" x="508" y="320" text-anchor="middle" style="font-size:11px">speed</text>
  <g id="traj-wheel" transform="translate(612,250)">
    <circle r="30" fill="none" stroke="#5F6773" stroke-width="5"/>
    <circle r="6" fill="#5F6773"/>
    <line x1="-28" y1="0" x2="-6" y2="0" stroke="#5F6773" stroke-width="4"/>
    <line x1="6" y1="0" x2="28" y2="0" stroke="#5F6773" stroke-width="4"/>
    <line x1="0" y1="6" x2="0" y2="28" stroke="#5F6773" stroke-width="4"/>
    <circle cx="0" cy="-30" r="3" fill="#B4342C"/>
  </g>
  <text class="svg-num" id="traj-angle" x="612" y="304" text-anchor="middle">0°</text>
  <text class="svg-label" x="612" y="320" text-anchor="middle" style="font-size:11px">steering</text>
  <text class="svg-label" x="450" y="354" style="font-size:11px">manoeuvre</text>
  <text class="svg-title" id="traj-man" x="450" y="372">keep course</text>
</svg>
