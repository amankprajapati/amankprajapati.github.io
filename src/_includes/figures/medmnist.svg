<svg viewBox="0 0 680 300" role="img" id="med-fig" aria-label="Real MedMNIST test images from four modalities are routed one at a time: the parent random forest votes on the modality, the matching expert model makes the diagnosis, and the right panel shows that modality's result and explanation.">
  <text class="svg-label" x="20" y="28">input, 28 × 28 pixels</text>
  <image href="assets/img/medmnist/oct.png" x="20" y="40" width="56" height="56" preserveAspectRatio="none" style="image-rendering:pixelated"/>
  <image href="assets/img/medmnist/chest-xray.png" x="20" y="102" width="56" height="56" preserveAspectRatio="none" style="image-rendering:pixelated"/>
  <image href="assets/img/medmnist/fundus.png" x="20" y="164" width="56" height="56" preserveAspectRatio="none" style="image-rendering:pixelated"/>
  <image href="assets/img/medmnist/ultrasound.png" x="20" y="226" width="56" height="56" preserveAspectRatio="none" style="image-rendering:pixelated"/>
  <g id="med-frames"></g>
  <path class="arrow" d="M84,160 L122,160"/>
  <rect x="126" y="40" width="172" height="240" rx="4" fill="#EEF1F5" stroke="#C9D0DA"/>
  <text class="svg-title" x="140" y="62">Parent random forest</text>
  <text class="svg-label" x="140" y="80" style="font-size:11px">tree votes on modality</text>
  <g id="med-votes"></g>
  <text class="svg-label" x="140" y="268" style="font-size:11px">98.7% routing accuracy</text>
  <g id="med-routes"></g>
  <text class="svg-label" x="328" y="54" style="font-size:11px">expert per modality</text>
  <g id="med-experts"></g>
  <rect x="470" y="40" width="190" height="240" rx="4" fill="#E8F3EC" stroke="#2C7A52"/>
  <text class="svg-title" id="med-r-title" x="484" y="62" style="fill:#1F5A3C"></text>
  <text class="svg-label" id="med-r-sub" x="484" y="80" style="font-size:11px"></text>
  <text class="svg-num" id="med-r-metric" x="484" y="106" style="font-size:13px"></text>
  <g id="med-r-vis"></g>
  <text class="svg-label" id="med-r-note1" x="484" y="248" style="font-size:11px"></text>
  <text class="svg-label" id="med-r-note2" x="484" y="264" style="font-size:11px"></text>
</svg>
